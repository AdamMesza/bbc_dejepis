<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBC News Style Header</title>
    <!-- Font Awesome for search/menu icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: ReithSans, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f6f6f6;
        }

        /* --- 1. TOP GLOBAL BAR (BLACK) --- */
        .top-bar {
            background-color: #222222;
            color: #ffffff;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 14px;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* The iconic 3-block BBC Logo */
        .bbc-blocks {
            display: flex;
            gap: 3px;
            text-decoration: none;
        }

        .bbc-blocks span {
            background-color: #ffffff;
            color: #000000;
            font-weight: 900;
            font-size: 18px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .account-link {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 1px solid #444;
            padding-left: 16px;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .top-nav-link {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            padding: 4px 8px;
        }

        .top-nav-link:hover {
            text-decoration: underline;
        }

        /* --- 2. MAIN NEWS BRANDING BAR (RED) --- */
        .news-bar {
            background-color: #bb1919;
            color: #ffffff;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #991414;
        }

        .news-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #ffffff;
        }

        .news-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .search-btn {
            background-color: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
        }

        .search-btn:hover {
            background-color: #991414;
        }

        /* --- 3. SUB NAVIGATION MENU (RED / DARK RED) --- */
        .topic-nav {
            background-color: #bb1919;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            overflow-x: auto;
            white-space: nowrap;
        }

        .topic-nav ul {
            display: flex;
            list-style: none;
            padding: 0 12px;
            margin: 0;
        }

        .topic-nav li a {
            display: inline-block;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 14px;
            position: relative;
        }

        .topic-nav li a:hover {
            background-color: #991414;
        }

        .topic-nav li.active a {
            font-weight: bold;
        }

        /* Bottom white indicator line for active topic */
        .topic-nav li.active a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: #ffffff;
        }

        /* Responsive design for smaller screens */
        @media (max-width: 768px) {
            .top-bar-right .top-nav-link {
                display: none;
            }
            .news-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <header>
        <!-- 1. Top Global Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <a href="#" class="bbc-blocks" aria-label="BBC Home">
                    <span>B</span>
                    <span>B</span>
                    <span>C</span>
                </a>
                <a href="#" class="account-link">
                    <i class="fa-regular fa-circle-user"></i>
                    <span>Sign in</span>
                </a>
            </div>
            
            <div class="top-bar-right">
                <a href="#" class="top-nav-link">Home</a>
                <a href="#" class="top-nav-link">News</a>
                <a href="#" class="top-nav-link">Sport</a>
                <a href="#" class="top-nav-link">Business</a>
                <a href="#" class="top-nav-link">Innovation</a>
                <a href="#" class="top-nav-link">Culture</a>
                <a href="#" class="top-nav-link">Travel</a>
            </div>
        </div>

        <!-- 2. Red News Branding Bar -->
        <div class="news-bar">
            <a href="#" class="news-brand">
                <span class="news-title">NEWS</span>
            </a>
            <button class="search-btn" aria-label="Search BBC">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span style="font-size: 14px; font-weight: 600;">Search BBC</span>
            </button>
        </div>

        <!-- 3. Topic Sub-Navigation -->
        <nav class="topic-nav">
            <ul>
                <li class="active"><a href="#">Home</a></li>
                <li><a href="#">Israel-Gaza War</a></li>
                <li><a href="#">War in Ukraine</a></li>
                <li><a href="#">US & Canada</a></li>
                <li><a href="#">UK</a></li>
                <li><a href="#">World</a></li>
                <li><a href="#">Business</a></li>
                <li><a href="#">Tech</a></li>
                <li><a href="#">Science</a></li>
                <li><a href="#">Entertainment & Arts</a></li>
            </ul>
        </nav>
    </header>

</body>
</html>
